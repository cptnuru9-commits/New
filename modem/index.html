<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Modem 2027 · הספירה לאחור</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;500;800&family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --neon1:#ffffff;
    --neon2:#b5b5b5;
    --neon3:#4a4a4a;
    --text:#f2f2f2;
    --muted:#808080;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Rubik",system-ui,sans-serif;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    min-height:100svh;
  }

  /* ---------- background layers ---------- */
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.95) 100%)}
  /* ---------- old-TV static ---------- */
  #static{position:fixed;inset:-384px;z-index:3;pointer-events:none;
    opacity:.16;image-rendering:pixelated;background-size:384px 384px;will-change:transform,opacity;
    animation:snow .5s steps(1) infinite,flicker .18s steps(2) infinite}
  @keyframes snow{
    0%{transform:translate(0,0)}            10%{transform:translate(-171px,113px)}
    20%{transform:translate(149px,-203px)}  30%{transform:translate(-263px,-47px)}
    40%{transform:translate(53px,271px)}    50%{transform:translate(-109px,-293px)}
    60%{transform:translate(287px,77px)}    70%{transform:translate(-41px,181px)}
    80%{transform:translate(211px,-113px)}  90%{transform:translate(-301px,229px)}
    100%{transform:translate(0,0)}
  }
  @keyframes flicker{50%{opacity:.12}}
  .scanlines{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.55) 0 1px,transparent 1px 3px)}
  .roll{position:fixed;top:0;left:0;right:0;height:22vh;will-change:transform;z-index:4;pointer-events:none;
    background:linear-gradient(to bottom,transparent,rgba(255,255,255,.05) 45%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.05) 55%,transparent);
    animation:roll 7s linear infinite}
  @keyframes roll{from{transform:translateY(-25vh)}to{transform:translateY(105vh)}}

  /* sacred-geometry mandala behind the timer */
  .mandala{position:fixed;z-index:4;width:min(120vmin,900px);aspect-ratio:1;
    top:50%;left:50%;transform:translate(-50%,-50%);opacity:.22;pointer-events:none}
  .mandala svg{width:100%;height:100%;will-change:transform;animation:spin 120s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- content ---------- */
  main{position:relative;z-index:5;text-align:center;padding:2rem 1.25rem;width:100%;max-width:1000px}

  .eyebrow{
    font-family:"Orbitron",sans-serif;font-size:clamp(.7rem,1.8vw,.9rem);
    letter-spacing:.5em;text-transform:uppercase;color:var(--neon2);
    direction:ltr;margin-bottom:1rem;opacity:.9
  }
  h1{
    font-family:"Orbitron",sans-serif;font-weight:800;direction:ltr;
    font-size:clamp(3rem,13vw,8.5rem);line-height:.95;letter-spacing:.06em;
    background:linear-gradient(180deg,#fff 30%,#6e6e6e);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,255,255,.18));
  }
  .sub{margin-top:.9rem;font-size:clamp(1rem,3vw,1.35rem);font-weight:300;color:var(--muted)}
  .sub b{color:var(--text);font-weight:500}

  .timer{
    display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(.5rem,2vw,1.25rem);
    margin:clamp(2rem,6vh,3.5rem) auto 0;max-width:820px;direction:ltr;
  }
  .unit{
    position:relative;padding:clamp(1rem,3vw,1.75rem) .25rem;
    border-radius:20px;
    background:linear-gradient(160deg,rgba(22,22,22,.82),rgba(8,8,8,.82));
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    overflow:hidden;
  }
  .unit::before{ /* neon edge */
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:linear-gradient(140deg,rgba(255,255,255,.55),transparent 40%,transparent 60%,rgba(255,255,255,.15));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;opacity:.7
  }
  .num{
    display:block;font-family:"Orbitron",sans-serif;font-weight:800;
    font-size:clamp(2rem,8.5vw,4.6rem);line-height:1;
    font-variant-numeric:tabular-nums;color:#fff;
    text-shadow:0 0 14px rgba(255,255,255,.35);
  }
  .num.tick{animation:tick .45s ease-out}
  @keyframes tick{0%{transform:translateY(-12%);opacity:.3;color:var(--neon2)}100%{transform:none;opacity:1}}
  .label{display:block;margin-top:.6rem;font-size:clamp(.75rem,2.2vw,1rem);color:var(--muted);direction:rtl;letter-spacing:.05em}

  .meta{margin-top:clamp(2rem,5vh,3rem);display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
  .chip{
    font-size:.85rem;padding:.45rem .95rem;border-radius:999px;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--muted)
  }
  .chip strong{color:#fff;font-weight:500}

  .done h1{filter:drop-shadow(0 0 30px rgba(255,255,255,.45))}

  @media (max-width:520px){
    .timer{grid-template-columns:repeat(2,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
  }
</style>
</head>
<body>

  <div class="mandala" aria-hidden="true">
    <svg viewBox="-100 -100 200 200" fill="none" stroke="#ffffff" stroke-width=".45">
      <g id="petals"></g>
      <circle r="95"/><circle r="70"/><circle r="45"/><circle r="20"/>
    </svg>
  </div>

  <div class="vignette"></div>
  <div id="static"></div>
  <div class="scanlines"></div>
  <div class="roll"></div>

  <main id="app">
    <p class="eyebrow">Korana Canyon · Croatia</p>
    <h1>MODEM</h1>
    <p class="sub">החבר'ה טסים לקרואטיה · <b>2 באוגוסט 2027</b></p>

    <section class="timer" aria-live="polite">
      <div class="unit"><span class="num" id="d">--</span><span class="label">ימים</span></div>
      <div class="unit"><span class="num" id="h">--</span><span class="label">שעות</span></div>
      <div class="unit"><span class="num" id="m">--</span><span class="label">דקות</span></div>
      <div class="unit"><span class="num" id="s">--</span><span class="label">שניות</span></div>
    </section>

    <div class="meta">
      <span class="chip">עוד <strong id="weeks">–</strong> שבועות</span>
      <span class="chip">עוד <strong id="sleeps">–</strong> לילות שינה</span>
    </div>
  </main>

<script>
  // 2 באוגוסט 2027, חצות לפי שעון קרואטיה (CEST, UTC+2)
  const TARGET = new Date("2027-08-02T00:00:00+02:00").getTime();

  const el = id => document.getElementById(id);
  const els = { d:el("d"), h:el("h"), m:el("m"), s:el("s") };
  const pad = n => String(n).padStart(2, "0");

  function set(key, value){
    const node = els[key];
    if (node.textContent !== value){
      node.textContent = value;
      node.classList.remove("tick"); void node.offsetWidth; node.classList.add("tick");
    }
  }

  function tick(){
    let diff = Math.max(0, TARGET - Date.now());
    const d = Math.floor(diff / 864e5);
    const h = Math.floor(diff / 36e5) % 24;
    const m = Math.floor(diff / 6e4) % 60;
    const s = Math.floor(diff / 1e3) % 60;

    set("d", String(d)); set("h", pad(h)); set("m", pad(m)); set("s", pad(s));
    el("weeks").textContent = Math.floor(d / 7);
    el("sleeps").textContent = Math.ceil(diff / 864e5);

    if (diff === 0){
      document.body.classList.add("done");
      document.querySelector(".sub").innerHTML = "<b>הגענו! 🔥 נתראה על הרחבה</b>";
      return;
    }
  }
  const timerId = setInterval(() => { tick(); if (document.body.classList.contains("done")) clearInterval(timerId); }, 250);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  tick();

  // ---- mandala petals ----
  const petals = el("petals");
  for (let i = 0; i < 12; i++){
    const a = i * 30;
    petals.insertAdjacentHTML("beforeend",
      `<ellipse rx="22" ry="70" transform="rotate(${a})"/>` +
      `<circle cx="0" cy="-58" r="10" transform="rotate(${a + 15})"/>`);
  }

  // ---- old-TV static: one noise tile, moved by CSS (GPU only) ----
  (() => {
    const t = document.createElement("canvas"); t.width = t.height = 192;
    const g = t.getContext("2d"), im = g.createImageData(192, 192), b = new Uint32Array(im.data.buffer);
    for (let i = 0; i < b.length; i++){ const v = (Math.random() * 255) | 0; b[i] = 0xff000000 | (v << 16) | (v << 8) | v; }
    g.putImageData(im, 0, 0);
    el("static").style.backgroundImage = `url(${t.toDataURL()})`;
  })();
</script>
</body>
</html>
